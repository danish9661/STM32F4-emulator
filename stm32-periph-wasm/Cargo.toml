[workspace]

[package]
name = "stm32-periph-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
# Fat LTO (`lto = true`) spikes the link to ~12.8 GB RSS on this 16 GB box
# and the kernel OOM-killer takes down the desktop + OpenChamber (proven:
# journalctl, 2026-11-05 and 2026-11-25, multiple sessions). Thin LTO keeps
# nearly all the optimisation at ~1-2 GB. Any session can build safely now.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
wasm-bindgen = "0.2"
log = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
svd-parser = "0.13"
aes = "0.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
des = "0.8"

