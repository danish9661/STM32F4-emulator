cpu:
  svd: ../saturn/stm32f407.svd
  vector_table: 0x08000000
regions:
  - name: ROM
    start: 0x08000000
    load: arduino_test.ino.bin
    size: 0x100000
  - name: RAM
    start: 0x20000000
    size: 0x20000
components:
  - name: pot1
    type: potentiometer
    position: 0.5
wires:
  - from: pot1.wiper
    to: ADC1.IN1
