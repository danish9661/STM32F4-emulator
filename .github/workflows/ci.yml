name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Boot-probe all bundled firmwares
        run: node site/probe_firmwares.mjs
      - name: Run the test suite
        run: npm test
