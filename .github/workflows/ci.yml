name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Boot-probe all bundled firmwares
        run: node site/probe_firmwares.mjs
      - name: Run the test suite
        shell: bash
        run: |
          set +e
          mkdir -p ci-logs
          : > results.txt
          for t in test_stm32f4_api.mjs test_stm32f4_periph.mjs test_ws_bridge.mjs test_flow.mjs test_blinky.mjs test_can.mjs test_audio.mjs test_ltdc.mjs test_dma.mjs test_exti.mjs test_flash.mjs test_eth_irq.mjs test_rx_interrupt.mjs test_spi_flash.mjs test_oled.mjs test_tft.mjs test_buzzer.mjs test_audio_play.mjs test_rtc.mjs test_lowpower.mjs test_candemo.mjs test_can_inject.mjs test_tim_capture.mjs test_qspi.mjs test_edge_cases.mjs; do
            echo "=== $t ==="
            node "site/$t" > "ci-logs/$t.log" 2>&1; ec=$?
            cat "ci-logs/$t.log"
            echo "$t: $ec" >> results.txt
            echo "--- exit $ec for $t ---"
          done
          cat results.txt
          if grep -v ': 0$' results.txt | grep -q ':'; then
            echo "FAILURES DETECTED:"; grep -v ': 0$' results.txt
            exit 1
          fi
          echo "ALL TESTS PASSED"
      - name: Publish CI debug (always)
        if: always()
        shell: bash
        run: |
          echo "===== results ====="
          cat results.txt 2>&1 || true
          echo "===== per-test logs (tail 80 each) ====="
          for f in ci-logs/*.log; do echo "--- $f ---"; tail -n 80 "$f" 2>&1 || true; echo; done
          echo "===== node info ====="
          node --version; npm --version; ls site/vendor/*.wasm 2>&1 | head
          {
            echo "### Test results (${{ matrix.os }})"
            echo '```'
            cat results.txt 2>&1 || true
            echo '```'
            echo "#### Failing logs (tail 60)"
            for f in ci-logs/*.log; do
              if grep -qi "FAIL\|Error" "$f" 2>/dev/null; then
                echo "**$f**"
                echo '```'; tail -n 60 "$f"; echo '```'
              fi
            done
          } >> $GITHUB_STEP_SUMMARY 2>&1 || true
      - name: Push debug logs to ci-debug branch (always)
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "ci-bot"
          git config user.email "ci@bot.local"
          TMPDIR=$(mktemp -d)
          cp results.txt "$TMPDIR/results-${{ matrix.os }}.txt" 2>/dev/null || echo "no results" > "$TMPDIR/results-${{ matrix.os }}.txt"
          cp ci-logs/*.log "$TMPDIR/" 2>/dev/null || true
          node --version > "$TMPDIR/node-${{ matrix.os }}.txt" 2>&1 || true
          cd "$TMPDIR"
          git init -b ci-debug 2>&1 | head
          git add .
          git commit -m "ci debug ${{ matrix.os }} ${{ github.sha }}" 2>&1 | head
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin ci-debug 2>&1 | head -20 || echo "push failed (may be concurrent)"
          echo "pushed debug branch"
      - name: MCP server protocol round-trip
        if: matrix.os == 'ubuntu-latest'
        run: npm ci && npm run test:mcp
