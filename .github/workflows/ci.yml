name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Boot-probe all bundled firmwares
        run: node site/probe_firmwares.mjs
      - name: Run the test suite
        run: |
          set +e
          node site/test_stm32f4_api.mjs 2>&1; echo "test_stm32f4_api.mjs: $?" > /tmp/results.txt
          node site/test_stm32f4_periph.mjs 2>&1; echo "test_stm32f4_periph.mjs: $?" >> /tmp/results.txt
          node site/test_ws_bridge.mjs 2>&1; echo "test_ws_bridge.mjs: $?" >> /tmp/results.txt
          node site/test_flow.mjs 2>&1; echo "test_flow.mjs: $?" >> /tmp/results.txt
          node site/test_blinky.mjs 2>&1; echo "test_blinky.mjs: $?" >> /tmp/results.txt
          node site/test_can.mjs 2>&1; echo "test_can.mjs: $?" >> /tmp/results.txt
          node site/test_audio.mjs 2>&1; echo "test_audio.mjs: $?" >> /tmp/results.txt
          node site/test_ltdc.mjs 2>&1; echo "test_ltdc.mjs: $?" >> /tmp/results.txt
          node site/test_dma.mjs 2>&1; echo "test_dma.mjs: $?" >> /tmp/results.txt
          node site/test_exti.mjs 2>&1; echo "test_exti.mjs: $?" >> /tmp/results.txt
          node site/test_flash.mjs 2>&1; echo "test_flash.mjs: $?" >> /tmp/results.txt
          node site/test_eth_irq.mjs 2>&1; echo "test_eth_irq.mjs: $?" >> /tmp/results.txt
          node site/test_rx_interrupt.mjs 2>&1; echo "test_rx_interrupt.mjs: $?" >> /tmp/results.txt
          node site/test_spi_flash.mjs 2>&1; echo "test_spi_flash.mjs: $?" >> /tmp/results.txt
          node site/test_oled.mjs 2>&1; echo "test_oled.mjs: $?" >> /tmp/results.txt
          node site/test_tft.mjs 2>&1; echo "test_tft.mjs: $?" >> /tmp/results.txt
          node site/test_buzzer.mjs 2>&1; echo "test_buzzer.mjs: $?" >> /tmp/results.txt
          node site/test_audio_play.mjs 2>&1; echo "test_audio_play.mjs: $?" >> /tmp/results.txt
          node site/test_rtc.mjs 2>&1; echo "test_rtc.mjs: $?" >> /tmp/results.txt
          node site/test_lowpower.mjs 2>&1; echo "test_lowpower.mjs: $?" >> /tmp/results.txt
          node site/test_candemo.mjs 2>&1; echo "test_candemo.mjs: $?" >> /tmp/results.txt
          node site/test_can_inject.mjs 2>&1; echo "test_can_inject.mjs: $?" >> /tmp/results.txt
          node site/test_tim_capture.mjs 2>&1; echo "test_tim_capture.mjs: $?" >> /tmp/results.txt
          node site/test_qspi.mjs 2>&1; echo "test_qspi.mjs: $?" >> /tmp/results.txt
          node site/test_edge_cases.mjs 2>&1; echo "test_edge_cases.mjs: $?" >> /tmp/results.txt
          cat /tmp/results.txt
          if grep -v ': 0$' /tmp/results.txt | grep -q ':'; then
            echo "FAILURES DETECTED:"
            grep -v ': 0$' /tmp/results.txt
            exit 1
          fi
          echo "ALL TESTS PASSED"
      - name: MCP server protocol round-trip
        if: matrix.os == 'ubuntu-latest'
        run: npm ci && npm run test:mcp
