name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        if: matrix.node == 22
        run: npx eslint . --max-warnings=50 || true
      - name: Boot-probe all bundled firmwares
        run: node site/probe_firmwares.mjs
      - name: Run the test suite
        run: npm run test:unit
      - name: MCP server protocol round-trip
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:mcp

  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo test
        run: cargo test --manifest-path stm32-periph-wasm/Cargo.toml
