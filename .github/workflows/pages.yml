name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install docs dependencies
        run: npm ci
        working-directory: website

      - name: Build docs
        run: npm run build 2>&1 | tail -5
        working-directory: website

      - name: Copy emulator console into docs build
        # site/ deploys under /console/, but /console/ itself must BE the
        # console (not the landing splash): promote console.html to the
        # directory index, keep the splash as landing.html, so both
        # /console/ and /console/console.html serve the console app.
        run: |
          mkdir -p website/build/console && cp -r site/* website/build/console/ \
          && cp website/build/console/index.html website/build/console/landing.html \
          && cp website/build/console/console.html website/build/console/index.html \
          && ls website/build/console/index.html website/build/console/console.html website/build/console/landing.html website/build/console/doom.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - uses: actions/deploy-pages@v4
