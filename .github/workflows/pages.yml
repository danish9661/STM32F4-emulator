name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install docs dependencies
        run: npm ci
        working-directory: website

      - name: Build docs
        run: npm run build
        working-directory: website

      - name: Copy emulator console into docs build
        run: mkdir -p website/build/console && cp -r site/* website/build/console/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - uses: actions/deploy-pages@v4
