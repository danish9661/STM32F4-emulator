name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install docs dependencies
        run: npm ci
        working-directory: website

      - name: Build docs
        run: npm run build 2>&1 | tail -5
        working-directory: website

      - name: Copy emulator console into docs build
        # site/ is the whole emulator UI — copy it FLAT into the build root
        # so the console lives at /console.html, DOOM at /doom.html, etc.
        # (no /console/ prefix). The Docusaurus root page is the splash
        # landing (website/src/pages/index.js), NOT a redirect.
        run: |
          cp -r site/* website/build/ \
          && ls website/build/console.html website/build/doom.html website/build/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - uses: actions/deploy-pages@v4
